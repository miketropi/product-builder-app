# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "cd5f35517b5f119a3f2166110eda635a"
name = "BM Insanity"
handle = "buildmat-app"
application_url = "https://bm-insanity.fly.dev/"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = "buildmatstaging.myshopify.com"
include_config_on_deploy = true

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_customers,read_files,read_metaobjects,read_orders,read_products,read_themes,unauthenticated_read_checkouts,unauthenticated_read_content,unauthenticated_read_customer_tags,unauthenticated_read_customers,unauthenticated_read_product_listings,unauthenticated_read_product_tags,unauthenticated_read_selling_plans,unauthenticated_write_checkouts,unauthenticated_write_customers,write_content,write_customers,write_draft_orders,write_files,write_metaobjects,write_orders,write_products,write_script_tags,write_themes"

[auth]
redirect_urls = [
  "https://bm-insanity.fly.dev/auth/callback",
  "https://bm-insanity.fly.dev/auth/shopify/callback",
  "https://bm-insanity.fly.dev/api/auth/callback"
]

[webhooks]
api_version = "2024-04"

[app_proxy]
url = "https://bm-insanity.fly.dev/app/proxy"
subpath = "bmapp"
prefix = "apps" 

[pos]
embedded = false
